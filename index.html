<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><title>Street Volley</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#f3f6f9;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:-apple-system,system-ui,sans-serif}
canvas{display:block}#fx{position:fixed;inset:0;pointer-events:none}
#hud{white-space:nowrap;background:rgba(255,255,255,.85);padding:4px 10px;border-radius:8px;position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
.pill{display:inline-block;padding:1px 10px;border-radius:6px;color:#fff;font-size:10px;font-weight:600;vertical-align:middle}
#home{background:#3ecf5a}#away{background:#ff6fae}#score{display:inline-block;font-size:20px;font-weight:300;margin:0 10px;vertical-align:middle;color:#333;letter-spacing:2px}
#dots{margin-top:2px;font-size:9px;color:#888}#dots i{display:inline-block;width:6px;height:6px;border-radius:50%;border:1px solid #9ab;margin:0 1px;background:#fff}
.pop{position:fixed;pointer-events:none;font-weight:700;font-size:14px;padding:3px 9px;background:#fff;border:2px solid #000;border-radius:12px;transform:translate(-50%,-100%);animation:pp .9s ease-out forwards}
.mul{background:#ffe14a;font-size:16px}
@keyframes pp{0%{transform:translate(-50%,-60%) scale(.3)}20%{transform:translate(-50%,-100%) scale(1.15)}100%{transform:translate(-50%,-170%) scale(1);opacity:0}}
#start{position:fixed;inset:0;background:rgba(255,255,255,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;z-index:9}
#start h1{font-size:44px;margin:0;-webkit-text-stroke:2px #000;color:#5fd8ff}
#rot{display:none;position:fixed;inset:0;background:#fff;z-index:10;align-items:center;justify-content:center;font-weight:900;font-size:22px;text-align:center}
@media (orientation:landscape) and (max-height:500px){#rot{display:flex}}
</style></head><body>
<canvas id="fx"></canvas>
<div id="hud"><span class="pill" id="home">home</span><span id="score">0 - 0</span><span class="pill" id="away">away</span><div id="sub" style="font-size:9px;color:#888">set 1</div><div id="dots"></div></div>
<div id="start"><h1>STREET VOLLEY</h1><p>Touche l'écran pour jouer</p></div>
<div id="tuto" style="display:none;position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 30px);transform:translateX(-50%);background:#fff;border:3px solid #000;border-radius:18px;padding:10px 16px;font-weight:600;font-size:12px;line-height:1.4;z-index:8;width:80%;max-width:340px;pointer-events:none">👆 Garde le doigt : cours<br>👆 Tape : saute / renvoie<br>👉 Glisse près du ballon : SMASH<br>👉 Glisse loin du ballon : plongeon<br>✌️ Tape à 2 doigts / petit coup de côté : glissade</div>
<div id="rot">📱↻<br>Tourne ton iPhone<br>en mode portrait</div>
<script type="module" src="game.js"></script></body></html>
